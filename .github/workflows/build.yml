name: Build images

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - entrypoint.sh
      - scripts/smoke-test.sh
      - .github/workflows/build.yml
  pull_request:
    paths:
      - Dockerfile
      - entrypoint.sh
      - scripts/smoke-test.sh
      - .github/workflows/build.yml
  schedule:
    # Weekly rebuild picks up Temurin and Ubuntu security updates.
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Java ${{ matrix.java }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        java: [8, 11, 17, 21, 25]
    env:
      PUSH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/java${{ matrix.java }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build arm64 image for testing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          build-args: JAVA_VERSION=${{ matrix.java }}
          load: true
          tags: arm64-java-test:${{ matrix.java }}
          cache-from: type=gha,scope=java${{ matrix.java }}
          cache-to: type=gha,scope=java${{ matrix.java }},mode=max

      - name: Smoke test (arm64, Wings-style run)
        run: ./scripts/smoke-test.sh arm64-java-test:${{ matrix.java }} ${{ matrix.java }} linux/arm64

      - name: Build and push multi-arch image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: JAVA_VERSION=${{ matrix.java }}
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=java${{ matrix.java }}
          cache-to: type=gha,scope=java${{ matrix.java }},mode=max
